<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quant Terminal</title><style>body{background:#10151f;color:#e4eaf5;font:14px system-ui;margin:16px}input,select,button{background:#202b3b;color:white;border:1px solid #43516a;border-radius:7px;padding:10px;max-width:100%}button{background:#245de0}label{display:inline-grid;gap:4px;margin:5px}input{width:90px}canvas{width:100%;background:#151e2b}#metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}#metrics div{background:#202b3b;padding:12px;border-radius:8px}table{width:100%;font-size:12px;border-collapse:collapse}td,th{padding:6px;border-bottom:1px solid #43516a;text-align:right}small{color:#aab6c8}</style><h2>QUANT TERMINAL V3</h2><small>Binance Futures • Chỉ đọc • Không đặt lệnh</small><p><input id="symbol" value="BTCUSDT"><select id="tf"><option>5m</option><option>15m</option><option>30m</option><option>1h</option><option>4h</option><option selected>1d</option></select><select id="kind"><option value="original" selected>RSI(2) nguyên bản • SMA5</option><option value="rsi">RSI(2) SL/TP cứng</option><option value="turtle">Turtle SL/TP cứng</option></select></p><canvas id="chart" height="280"></canvas><button id="prev">‹</button> <button id="next">›</button><p><label>Vốn<input id="capital" type="number" value="5000"></label><label class="fixed">SL cố định USD<input type="number" value="50" readonly></label><label class="fixed">TP R<input id="rr" type="number" value="6" step=".1"></label><label class="fixed">Vị thế tối đa USD<input type="number" value="5000" readonly></label><label>Phí %<input id="fee" type="number" value=".05" step=".01"></label><label>Số nến<input id="count" type="number" value="9000"></label></p><p id="originalInfo">RSI2 / SMA200 / thoát SMA5 • 95% vốn hiện tại • Không SL/TP cứng</p><button id="run">Chạy backtest</button> <button id="matrix">Ma trận 42</button><p id="status">Chưa tải dữ liệu.</p><div id="metrics"></div><h3>Đường vốn đã đóng</h3><canvas id="equity" height="150"></canvas><h3>Kết quả</h3><div id="results"></div><script type="module">
import{test}from './engine.mjs';const $=id=>document.getElementById(id);let bars=[],r,offset=0;const fmt=x=>x==null?'—':x.toFixed(2);function opts(){let o={kind:$('kind').value};for(let k of (o.kind==='original'?['capital','fee']:['capital','rr','fee'])){o[k]=Number($(k).value);if(!Number.isFinite(o[k])||o[k]<(k==='fee'?0:.00001))throw Error('Thông số không hợp lệ: '+k)}o.fee/=100;return o}async function load(tf){let q=new URLSearchParams({symbol:$('symbol').value.toUpperCase(),interval:tf,count:$('count').value});let res=await fetch('/.netlify/functions/candles?'+q),a=await res.json();if(!res.ok||!Array.isArray(a)||a.length<201)throw Error(a.error||'Không đủ dữ liệu');return a}function ctx(id){let e=$(id);e.width=e.clientWidth;return[e.getContext('2d'),e.width,e.height]}function draw(){let [g,w,h]=ctx('chart'),end=bars.length-offset,start=Math.max(0,end-85),v=bars.slice(start,end),lo=Math.min(...v.map(x=>x[3])),hi=Math.max(...v.map(x=>x[2])),y=p=>10+(hi-p)/(hi-lo||1)*(h-30),step=(w-60)/v.length;g.font='10px system-ui';for(let k=0;k<5;k++){let p=hi-(hi-lo)*k/4;g.fillStyle='#aab6c8';g.fillText(p.toFixed(0),w-55,y(p));}v.forEach((x,i)=>{let xx=(i+.5)*step;g.strokeStyle=g.fillStyle=x[4]>=x[1]?'#22c99a':'#f06070';g.beginPath();g.moveTo(xx,y(x[2]));g.lineTo(xx,y(x[3]));g.stroke();g.fillRect(xx-step*.3,Math.min(y(x[1]),y(x[4])),Math.max(1,step*.6),Math.max(1,Math.abs(y(x[1])-y(x[4]))))});for(let t of [...r.trades,...(r.p?[r.p]:[])])if(t.i>=start&&t.i<end){g.fillStyle=t.s>0?'#22c99a':'#f06070';g.fillText(t.s>0?'BUY':'SELL',(t.i-start)*step,y(t.e));for(let [p,c] of [[t.sl,'#f06070'],[t.tp,'#22c99a']]){if(!Number.isFinite(p))continue;g.strokeStyle=c;g.beginPath();g.moveTo((t.i-start)*step,y(p));g.lineTo(Math.min(w-60,((t.j??end)-start)*step),y(p));g.stroke()}}}function show(){draw();$('metrics').innerHTML=Object.entries({'Lãi ròng USD':r.net,'Win rate %':r.wr*100,'RR thực':r.rr,'PF':r.pf,'DD %':r.dd*100,'Vốn thấp nhất':r.low,'Vốn cuối':r.eq,'Phí':r.fees,'Lệnh đóng':r.trades.length,'Lệnh mở':r.p?1:0}).map(([k,v])=>`<div>${k}<h3>${fmt(v)}</h3></div>`).join('');let[g,w,h]=ctx('equity'),lo=r.low,hi=r.peak;g.strokeStyle='#22c99a';g.beginPath();r.curve.forEach((v,i)=>{let x=i/(r.curve.length-1)*w,y=5+(hi-v)/(hi-lo||1)*(h-10);i?g.lineTo(x,y):g.moveTo(x,y)});g.stroke();$('results').innerHTML='<table><tr><th>Ngày</th><th>Side</th><th>Entry</th><th>Exit</th><th>PnL</th></tr>'+r.trades.slice(-100).reverse().map(t=>`<tr><td>${new Date(bars[t.i][0]).toISOString().slice(0,10)}</td><td>${t.s>0?'BUY':'SELL'}</td><td>${fmt(t.e)}</td><td>${fmt(t.ex)}</td><td>${fmt(t.net)}</td></tr>`).join('')+'</table>'}async function work(matrix){$('run').disabled=$('matrix').disabled=true;try{let o=opts();if(!matrix){$('status').textContent='Đang tải Binance…';bars=await load($('tf').value);r=test(bars,o);offset=0;show();$('status').textContent=bars.length+' nến thật • '+new Date(bars[0][0]).toISOString()+' → '+new Date(bars.at(-1)[0]).toISOString()+(o.kind==='original'?' • Thoát SMA5 • Không SL cứng • Không mô hình trượt giá':' • SL 50 USD trước phí/trượt giá')+' • Chưa tính funding'}else{let rows=[];for(let tf of ['5m','15m','30m','1h','4h','1d']){$('status').textContent='Đang kiểm định '+tf;let b=await load(tf);for(let rr of [1.2,2,3,4,6,8,12]){let z=test(b,{...o,kind:o.kind==='original'?'rsi':o.kind,rr});rows.push(`<tr><td>${tf}</td><td>${rr}</td><td>${z.trades.length}</td><td>${fmt(z.wr*100)}</td><td>${fmt(z.net)}</td><td>${fmt(z.dd*100)}</td></tr>`)}$('results').innerHTML='<table><tr><th>TF</th><th>TP</th><th>Lệnh</th><th>WR%</th><th>PnL</th><th>DD%</th></tr>'+rows.join('')+'</table>'}$('status').textContent='42 tổ hợp SL/TP cứng hoàn tất; mỗi khung có số nến tương đương, thời gian khác nhau.'}}catch(e){$('status').textContent='Lỗi: '+e.message+' — không dùng dữ liệu giả.'}finally{$('run').disabled=$('matrix').disabled=false}}function mode(){let original=$('kind').value==='original';document.querySelectorAll('.fixed').forEach(x=>x.style.display=original?'none':'inline-grid');$('originalInfo').hidden=!original;$('matrix').textContent=original?'Ma trận 42 (SL/TP cứng)':'Ma trận 42';} $('kind').onchange=mode;mode();$('run').onclick=()=>work(false);$('matrix').onclick=()=>work(true);$('prev').onclick=()=>{if(r){offset=Math.min(Math.max(0,bars.length-85),offset+40);draw()}};$('next').onclick=()=>{if(r){offset=Math.max(0,offset-40);draw()}};
</script></html>
